# The platform on one machine, with its database on MongoDB Atlas.
# `docker compose up -d`, then open http://<machine>:8787 (or the HTTPS
# address in front of it).
#
# There is one database: the Atlas cluster in MONGODB_URI, set in a .env file
# next to this one (git ignores .env). No MongoDB runs on this machine, so
# nothing else competes with the platform for memory. Without MONGODB_URI,
# `docker compose up` stops with a message instead of starting.

services:
  platform:
    build: .
    ports:
      - "8787:8787"
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI (the Atlas connection string) in .env next to docker-compose.yml}
      MONGODB_DB: ${MONGODB_DB:-pyena}
      # true once the site is served over HTTPS (behind a proxy or a host's TLS).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # Used when ANTHROPIC_API_KEY is empty. The values come from the server's own
      # .env next to this file; the image never contains them (.dockerignore).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    restart: unless-stopped
