[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyENA"
version = "0.1.0"
description = "A Python rewrite of the core rENA workflow for Epistemic Network Analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "Owen" }
]
urls = { Repository = "https://github.com/owen198/pyENA" }
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "scipy>=1.13",
]
keywords = ["ENA", "epistemic network analysis", "learning analytics", "quantitative ethnography"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "Topic :: Education",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
